<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>请假休学规则决策面板</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #e6eaf2;
      --blue: #2563eb;
      --blue2: #eaf1ff;
      --green: #12a66a;
      --green2: #e9f8f1;
      --orange: #f59e0b;
      --orange2: #fff5df;
      --red: #e5484d;
      --red2: #fff0f1;
      --purple: #7c3aed;
      --purple2: #f3ecff;
      --shadow: 0 18px 45px rgba(23, 32, 51, .1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0, #dfeaff 0, transparent 26%),
        radial-gradient(circle at 94% 0, #f5eafe 0, transparent 24%),
        var(--bg);
      font-size: 14px;
    }

    button, textarea { font-family: inherit; }

    .page {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 26px 22px 64px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.35fr .8fr;
      gap: 18px;
      margin-bottom: 16px;
      align-items: stretch;
    }

    .hero-main, .hero-side, .card {
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(230, 234, 242, .95);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(23, 32, 51, .06);
    }

    .hero-main { padding: 26px; }
    .hero-side { padding: 18px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #1d4ed8;
      background: var(--blue2);
      border: 1px solid #c7d7fe;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      letter-spacing: 0;
      line-height: 1.18;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
      font-size: 15px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px;
      background: #fbfcff;
      min-height: 74px;
    }

    .metric b {
      display: block;
      font-size: 22px;
      line-height: 1.15;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.45;
    }

    .hero-side h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .hero-side ol {
      margin: 0;
      padding-left: 20px;
      color: #475467;
      line-height: 1.85;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      align-items: start;
    }

    .rail {
      position: sticky;
      top: 18px;
      display: grid;
      gap: 14px;
    }

    .card-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .card-head h2, .card-head h3 {
      margin: 0;
      font-size: 18px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      margin-top: 5px;
    }

    .decision-card {
      margin-bottom: 16px;
      overflow: hidden;
    }

    .decision-body {
      padding: 18px 20px 20px;
    }

    .context-box {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 12px;
      align-items: start;
      border: 1px solid #dbe6fb;
      background: #f8fbff;
      border-radius: 14px;
      padding: 14px;
      color: #475467;
      line-height: 1.65;
      margin-bottom: 14px;
    }

    .context-box b {
      color: #1d4ed8;
      font-size: 13px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .option-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .option-card {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 15px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
      transition: .16s ease;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: inherit;
    }

    .option-card:hover {
      transform: translateY(-1px);
      border-color: #afc4ff;
      box-shadow: 0 12px 24px rgba(37, 99, 235, .08);
    }

    .option-card.active {
      border-color: #8fb0ff;
      background: linear-gradient(180deg, #f7faff, #ffffff);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
    }

    .option-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .option-letter {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      color: #1d4ed8;
      background: var(--blue2);
      font-weight: 900;
      flex: 0 0 auto;
    }

    .option-title {
      font-weight: 900;
      font-size: 15px;
      line-height: 1.45;
      flex: 1;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .tag.blue { color: #1d4ed8; background: var(--blue2); }
    .tag.green { color: #08784f; background: var(--green2); }
    .tag.orange { color: #a15c07; background: var(--orange2); }
    .tag.red { color: #b42318; background: var(--red2); }
    .tag.purple { color: #6d28d9; background: var(--purple2); }
    .tag.gray { color: #475467; background: #f2f4f7; }

    .option-desc {
      color: #475467;
      line-height: 1.62;
      font-size: 13px;
      min-height: 42px;
    }

    .tradeoff {
      display: grid;
      gap: 8px;
      margin-top: auto;
    }

    .tradeoff-row {
      border-radius: 12px;
      padding: 10px 11px;
      font-size: 12px;
      line-height: 1.55;
      color: #475467;
    }

    .tradeoff-row.good { background: var(--green2); color: #066044; }
    .tradeoff-row.cost { background: var(--orange2); color: #8a4a05; }
    .tradeoff-row.effect { background: #f8fafc; color: #475467; border: 1px dashed #ccd6e4; }

    .progress-card, .summary-card, .output-card { overflow: hidden; }

    .progress-body, .summary-body, .output-body { padding: 16px; }

    .progress-bar {
      height: 9px;
      background: #eef2f7;
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0 14px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--blue), var(--green));
      border-radius: inherit;
      transition: width .2s ease;
    }

    .step-list {
      display: grid;
      gap: 8px;
    }

    .step-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 9px;
      color: #475467;
      background: #fff;
      line-height: 1.4;
    }

    .step-num {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #f2f4f7;
      color: #667085;
      font-weight: 900;
      font-size: 12px;
    }

    .step-item.done {
      border-color: #a9e8ca;
      background: #f9fffb;
    }

    .step-item.done .step-num {
      background: var(--green2);
      color: #08784f;
    }

    .answer-list {
      display: grid;
      gap: 9px;
    }

    .answer-item {
      border: 1px solid var(--line);
      background: #fbfcff;
      border-radius: 12px;
      padding: 11px;
    }

    .answer-item b {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .answer-item span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      padding: 10px 0;
    }

    .copy-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .copy-row .hint { margin: 0; }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 9px 13px;
      font-weight: 900;
      cursor: pointer;
      transition: .16s ease;
      white-space: nowrap;
    }

    .btn.primary { color: #fff; background: var(--blue); }
    .btn.primary:hover { background: #1d4ed8; }
    .btn.secondary { color: #344054; background: #eef2f7; }
    .btn.ghost { color: #1d4ed8; background: var(--blue2); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    textarea {
      width: 100%;
      min-height: 260px;
      border: 1px solid #d0d5dd;
      border-radius: 14px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.7;
      color: #344054;
      background: #fbfcff;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    .toast {
      position: fixed;
      z-index: 80;
      top: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      opacity: 0;
      pointer-events: none;
      color: #fff;
      background: #111827;
      border-radius: 999px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      transition: .2s ease;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .mobile-output { display: none; }

    @media (max-width: 1080px) {
      .hero, .layout { grid-template-columns: 1fr; }
      .rail { position: static; }
      .desktop-output { display: none; }
      .mobile-output { display: block; }
    }

    @media (max-width: 760px) {
      .page { padding: 18px 14px 40px; }
      .metrics, .option-grid, .option-grid.three { grid-template-columns: 1fr; }
      .context-box { grid-template-columns: 1fr; }
      h1 { font-size: 26px; }
      .hero-main, .hero-side, .decision-body, .card-head { padding: 16px; }
      .copy-row { align-items: stretch; flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <main class="page">
    <section class="hero">
      <div class="hero-main">
        <div class="eyebrow">请假 / 休学规则确认</div>
        <h1>业务决策面板</h1>
        <p class="subtitle">这页用于快速确认研发落地前的关键规则。请按每张卡片选择 A / B / C，全部选完后，页面底部会自动生成一段确认文字，可以一键复制发回给产品。</p>
        <div class="metrics">
          <div class="metric"><b>5</b><span>需要拍板的规则</span></div>
          <div class="metric"><b>2-3</b><span>每题选项数量</span></div>
          <div class="metric"><b>自动</b><span>生成确认文字</span></div>
          <div class="metric"><b>1键</b><span>复制结果给产品</span></div>
        </div>
      </div>
      <aside class="hero-side">
        <h2>怎么使用</h2>
        <ol>
          <li>先看每题的背景和选项影响。</li>
          <li>直接点击最符合业务规则的选项。</li>
          <li>全部选完后复制底部文本。</li>
        </ol>
      </aside>
    </section>

    <section class="layout">
      <div id="questionList"></div>

      <aside class="rail">
        <section class="card progress-card">
          <div class="card-head">
            <div>
              <h3>确认进度</h3>
              <div class="hint" id="progressText">尚未开始选择</div>
            </div>
          </div>
          <div class="progress-body">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="step-list" id="stepList"></div>
          </div>
        </section>

        <section class="card summary-card">
          <div class="card-head">
            <div>
              <h3>当前选择</h3>
              <div class="hint">会随业务点击实时更新</div>
            </div>
          </div>
          <div class="summary-body" id="answerList"></div>
        </section>

        <section class="card output-card desktop-output">
          <div class="card-head">
            <div>
              <h3>最终确认文本</h3>
              <div class="hint">全部选完后复制给产品</div>
            </div>
          </div>
          <div class="output-body">
            <div class="copy-row">
              <div class="hint" id="copyHintDesktop">待完成全部选择</div>
              <button class="btn primary" id="copyBtnDesktop" onclick="copySummary()" disabled>复制文本</button>
            </div>
            <textarea id="summaryDesktop" readonly></textarea>
          </div>
        </section>
      </aside>
    </section>

    <section class="card output-card mobile-output">
      <div class="card-head">
        <div>
          <h3>最终确认文本</h3>
          <div class="hint">全部选完后复制给产品</div>
        </div>
      </div>
      <div class="output-body">
        <div class="copy-row">
          <div class="hint" id="copyHintMobile">待完成全部选择</div>
          <button class="btn primary" id="copyBtnMobile" onclick="copySummary()" disabled>复制文本</button>
        </div>
        <textarea id="summaryMobile" readonly></textarea>
      </div>
    </section>
  </main>

  <script>

        title: '5. 高阶课跨订单时，请假次数怎么扣？',
        lead: '如果高阶课的 2 个课时分别来自订单 A 和订单 B,请假次数是否按订单来源分别扣。',
        background: '这个选择会决定多订单场景下的扣减顺序，也会影响订单 A 无次数、订单 B 有次数时是否允许请假。',
        options: [
          {
            value: 'A',
            label: '按课时来源分别扣',
            tag: '来源一致',
            tagColor: 'green',
            desc: '订单 A 出 1 个课时，就扣 A 的 1 次请假；订单 B 同理。',
            pros: '课时来源和权益扣减一一对应，账务解释最清楚。',
            cons: '任一来源订单无请假次数时，就会导致整节高阶课无法请假。',
            effects: '需要按课时来源拆分校验和扣减。',
            copyText: '高阶课如 2 个课时来自不同订单，请假次数按课时来源分别扣减：订单 A 消耗 1 次，订单 B 消耗 1 次。'
          },
          {
            value: 'B',
            label: '只看总次数，允许从任一订单扣 2 次',
            tag: '总量优先',
            tagColor: 'blue',
            desc: '不强制按课时来源扣，只要该 SID 下总请假次数足够 2 次即可。',
            pros: '请假成功率更高，业务处理更灵活。',
            cons: '订单来源和权益扣减不完全对应，后续解释成本更高。',
            effects: '需要定义扣减优先级，例如先到期先扣、先主订单后赠送。',
            copyText: '高阶课跨订单时，不强制按课时来源扣减；只要对应 PID / SID 下总请假次数足够 2 次，即允许从任一可用订单 / 权益中扣满 2 次。'
          }
        ]
      }
    ];

    const appState = { answers: {} };

    const questionList = document.getElementById('questionList');
    const stepList = document.getElementById('stepList');
    const answerList = document.getElementById('answerList');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const toast = document.getElementById('toast');

    function renderQuestions() {
      questionList.innerHTML = questions.map(q => {
        const gridClass = q.options.length === 3 ? 'option-grid three' : 'option-grid';
        return `<section class="card decision-card" id="card-${q.id}">
          <div class="card-head">
            <div>
              <h2>${q.title}</h2>
              <div class="hint">${q.lead}</div>
            </div>
            <span class="tag gray" id="status-${q.id}">待选择</span>
          </div>
          <div class="decision-body">
            <div class="context-box"><b>背景信息</b><div>${q.background}</div></div>
            <div class="${gridClass}">
              ${q.options.map(opt => renderOption(q, opt)).join('')}
            </div>
          </div>
        </section>`;
      }).join('');
    }

    function renderOption(q, opt) {
      const tagHtml = opt.tag ? `<span class="tag ${opt.tagColor || 'gray'}">${opt.tag}</span>` : '';
      const descHtml = opt.desc || '';
      const prosHtml = opt.pros ? `<div class="tradeoff-row good"><b>优点</b><br>${opt.pros}</div>` : '';
      const consHtml = opt.cons ? `<div class="tradeoff-row cost"><b>代价</b><br>${opt.cons}</div>` : '';
      const effectsHtml = opt.effects ? `<div class="tradeoff-row effect"><b>影响</b><br>${opt.effects}</div>` : '';
      return `<button class="option-card" id="option-${q.id}-${opt.value}" onclick="selectOption('${q.id}', '${opt.value}')">
        <div class="option-top">
          <span class="option-letter">${opt.value}</span>
          <div class="option-title">${opt.label}</div>
          ${tagHtml}
        </div>
        <div class="option-desc">${descHtml}</div>
        <div class="tradeoff">
          ${prosHtml}
          ${consHtml}
          ${effectsHtml}
        </div>
      </button>`;
    }

    function selectOption(questionId, value) {
      appState.answers[questionId] = value;
      renderAll();
    }

    function renderProgress() {
      const answered = questions.filter(q => appState.answers[q.id]).length;
      const total = questions.length;
      progressFill.style.width = `${Math.round(answered / total * 100)}%`;
      progressText.textContent = answered === total ? '已完成全部选择，可以复制结果' : `已完成 ${answered} / ${total} 个选择`;
      stepList.innerHTML = questions.map((q, idx) => {
        const opt = getSelectedOption(q);
        return `<div class="step-item ${opt ? 'done' : ''}" onclick="document.getElementById('card-${q.id}').scrollIntoView({behavior:'smooth', block:'start'})">
          <div class="step-num">${opt ? '✓' : idx + 1}</div>
          <div><b>${q.title.replace(/^\d+\.\s*/, '')}</b><br><span>${opt ? `${opt.value}. ${opt.label}` : '待业务选择'}</span></div>
        </div>`;
      }).join('');
    }

    function renderSelections() {
      questions.forEach(q => {
        q.options.forEach(opt => {
          const el = document.getElementById(`option-${q.id}-${opt.value}`);
          if (el) el.classList.toggle('active', appState.answers[q.id] === opt.value);
        });
        const status = document.getElementById(`status-${q.id}`);
        const selected = getSelectedOption(q);
        if (status) {
          status.className = `tag ${selected ? 'green' : 'gray'}`;
          status.textContent = selected ? `已选 ${selected.value}` : '待选择';
        }
      });

      const selectedQuestions = questions.filter(q => appState.answers[q.id]);
      if (!selectedQuestions.length) {
        answerList.innerHTML = '<div class="empty">业务每选择一个选项，这里会同步显示当前结论。</div>';
        return;
      }
      answerList.innerHTML = selectedQuestions.map(q => {
        const opt = getSelectedOption(q);
        return `<div class="answer-item"><b>${q.title}</b><span>${opt.value}. ${opt.label}${opt.effects ? '<br>' + opt.effects : ''}</span></div>`;
      }).join('');
    }

    function renderSummary() {
      const complete = questions.every(q => appState.answers[q.id]);
      const text = buildSummary();
      document.getElementById('summaryDesktop').value = text;
      document.getElementById('summaryMobile').value = text;
      ['Desktop', 'Mobile'].forEach(type => {
        const btn = document.getElementById(`copyBtn${type}`);
        const hint = document.getElementById(`copyHint${type}`);
        btn.disabled = !complete;
        hint.textContent = complete ? '已生成完整确认文本' : '待完成全部选择';
      });
    }

    function buildSummary() {
      const missing = questions.filter(q => !appState.answers[q.id]);
      const lines = ['请假 / 休学规则业务确认结果：', ''];

      questions.forEach(q => {
        const opt = getSelectedOption(q);
        lines.push(`${q.title}`);
        lines.push(opt ? `- 选择：${opt.value}. ${opt.label}` : '- 选择：待确认');
        lines.push(opt ? `- 规则：${opt.copyText || opt.label}` : '- 规则：暂无，需业务补充选择');
        lines.push('');
      });

      if (missing.length) {
        lines.push(`仍有 ${missing.length} 项待确认：${missing.map(q => q.title.replace(/^\d+\.\s*/, '')).join('、')}。`);
      } else {
        lines.push('以上为本次业务确认结果，可按该规则进入产品方案和研发落地。');
      }

      return lines.join('\n');
    }

    function getSelectedOption(q) {
      return q.options.find(opt => opt.value === appState.answers[q.id]);
    }

    async function copySummary() {
      const text = buildSummary();
      try {
        await navigator.clipboard.writeText(text);
        showToast('已复制确认文本');
      } catch (error) {
        const textarea = document.getElementById(window.innerWidth <= 1080 ? 'summaryMobile' : 'summaryDesktop');
        textarea.focus();
        textarea.select();
        document.execCommand('copy');
        showToast('已复制确认文本');
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function renderAll() {
      renderProgress();
      renderSelections();
      renderSummary();
    }

    renderQuestions();
    renderAll();
  </script>
</body>
</html>
